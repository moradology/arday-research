m/users/soundcloud%3Ausers%3A332593335","urn":"soundcloud:users:332593335","username":"Surviving Society","verified":false,"visuals":{"urn":"soundcloud:users:332593335","enabled":true,"visuals":[{"urn":"soundcloud:visuals:191918739","entry_time":0,"visual_url":"https://i1.sndcdn.com/visuals-000332593335-95ZeEO-original.jpg"}],"tracking":null},"badges":{"pro":false,"creator_mid_tier":false,"pro_unlimited":true,"verified":false},"station_urn":"soundcloud:system-playlists:artist-stations:332593335","station_permalink":"artist-stations:332593335","date_of_birth":null},"tracks":[{"artwork_url":"https://i1.sndcdn.com/artworks-2ZFmFBUXG3k6PVFH-33I9SA-large.jpg","caption":null,"commentable":true,"comment_count":null,"created_at":"2021-05-24T17:10:12Z","description":"The Surviving Society team are extremely excited to present #TheSpotlightSeries. In these episodes Chantelle and Tissot take a step back from the mic and handover to both local and global academics, researchers, and community organizers. The Spotlight series continues with the themes from the original Surviving Society podcast focused on race, class, anti- racism and social movements.\n\nGuest Hosts:\nKaris Campion - Karis is a Legacy in Action Research Fellow at the Stephen Lawrence Research Centre. Her current research focuses on barbershops and examines their function as counter-hegemonic spaces and key social institutions for Black communities in Britain. She is currently writing a book entitled Making Mixed Race: A Study of Time, Place and Identity (Routledge). Her research interests span areas of (mixed) race/ethnic identity, geographies of race in urban space, intersectional inequalities, youth identities, anti-racism and institutional racism in education.\n\nStephen Ashe - Stephen Ashe is a Teaching Fellow in the Department of Sociology at Durham University. Prior to joining the Sociology Department, Stephen was a Research Associate in the Centre on Dynamics of Ethnicity at the University of Manchester where he conducted research on untold stories in the anti-racist and anti-imperial struggle for civil rights and social justice in Britain during the 1960s and 1970s (with Satnam Virdee), workplace racism (with James Nazroo), and the relationship between race and class in post-Brexit Britain (with James Rhodes and Sivamohan Valluvan). Since 2018, Stephen has carried out research on different aspects of racial inequality and institutional whiteness in higher education at four different universities in England. This included research on the awarding gap in the social sciences, the effectiveness of widening participation schemes and the transition to undergraduate student life, and the impact of programmes designed to empower students racialised as non-white through the creation of safe spaces and a sense of belonging. Stephen co-edited and contributed to Routledge’s recently published edited collection, Researching the Far Right: Theory, Method and Practice (Ashe, Busher, Macklin and Winter, 2020).\n\nRemi Joseph-Salisbury - Remi is a Presidential Fellow in Ethnicity and Inequalities at the University of Manchester. He is the author of 'Black Mixed-Race Men', and co-editor of 'The Fire Now: Anti-Racism in Times of Explicit Racial Violence'. He has written widely on race and racism, with a particular focus on education and policing. His forthcoming work, with Dr Laura Connelly, focuses on anti-racist scholar-activism in UK universities and will be published as a book in 2021.\n\nRace and Ethnicity in British Sociology Report: https://www.britsoc.co.uk/media/25345/bsa_race_and_ethnicity_in_british_sociology_report.pdf","downloadable":true,"download_count":null,"duration":2434286,"full_duration":2434273,"embeddable_by":"all","genre":"News \u0026 Politics","has_downloads_left":true,"id":1054676269,"kind":"track","label_name":null,"last_modified":"2021-06-15T02:00:03Z","license":"all-rights-reserved","likes_count":null,"permalink":"s3e1-race-ethnicity-in-british-sociology-karis-campion-stephen-ashe-remi-joseph-salisbury","permalink_url":"https://soundcloud.com/user-622675754/s3e1-race-ethnicity-in-british-sociology-karis-campion-stephen-ashe-remi-joseph-salisbury","playback_count":null,"public":true,"publisher_metadata":{"id":1054676269,"urn":"soundcloud:tracks:1054676269","artist":"Spotlight","contains_music":true},"purchase_title":null,"purchase_url":null,"release_date":"2021-06-15T00:00:00Z","reposts_count":0,"secret_token":null,"sharing":"public","state":"finished","streamable":true,"tag_list":"","title":"S3/E1 Race \u0026 Ethnicity in British Sociology (Karis Campion, Stephen Ashe \u0026 Remi Joseph-Salisbury)","uri":"https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A1054676269","urn":"soundcloud:tracks:1054676269","user_id":332593335,"visuals":null,"waveform_url":"https://wave.sndcdn.com/2AbWMOeelpq8_m.json","display_date":"2021-06-15T02:00:03Z","media":{"transcodings":[{"url":"https://api-v2.soundcloud.com/media/soundcloud:tracks:1054676269/797fe982-7c47-4164-afa2-edd884ebfbdc/stream/hls","preset":"aac_96k","duration":2434286,"snipped":false,"format":{"protocol":"hls","mime_type":"audio/mp4; codecs=\"mp4a.40.2\""},"quality":"lq","is_legacy_transcoding":false},{"url":"https://api-v2.soundcloud.com/media/soundcloud:tracks:1054676269/1a9a7ef0-0a49-48d5-9399-6536ad494861/stream/hls","preset":"abr_sq","duration":2434286,"snipped":false,"format":{"protocol":"hls","mime_type":"audio/mpegurl"},"quality":"sq","is_legacy_transcoding":false},{"url":"https://api-v2.soundcloud.com/media/soundcloud:tracks:1054676269/111c5879-e8fc-49b8-a4a9-fe3b7a16eb96/stream/hls","preset":"mp3_0_1","duration":2434273,"snipped":false,"format":{"protocol":"hls","mime_type":"audio/mpeg"},"quality":"sq","is_legacy_transcoding":true},{"url":"https://api-v2.soundcloud.com/media/soundcloud:tracks:1054676269/111c5879-e8fc-49b8-a4a9-fe3b7a16eb96/stream/progressive","preset":"mp3_0_1","duration":2434273,"snipped":false,"format":{"protocol":"progressive","mime_type":"audio/mpeg"},"quality":"sq","is_legacy_transcoding":true}]},"station_urn":"soundcloud:system-playlists:track-stations:1054676269","station_permalink":"track-stations:1054676269","track_authorization":"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJnZW8iOiJVUyIsInN1YiI6IiIsInJpZCI6IiIsImlhdCI6MTc4NjIyOTQ2N30.q70LpUyKn0_HQk2iT5uW4c6bKgju23HnrqQ1IH0oDS4","monetization_model":"NOT_APPLICABLE","policy":"ALLOW","user":{"avatar_url":"https://i1.sndcdn.com/avatars-YwydBGYIMyTLcfND-FB8F7Q-large.jpg","first_name":"","followers_count":551,"full_name":"","id":332593335,"kind":"user","last_modified":"2024-02-06T08:44:47Z","last_name":"","permalink":"user-622675754","permalink_url":"https://soundcloud.com/user-622675754","uri":"https://api.soundcloud.com/users/soundcloud%3Ausers%3A332593335","urn":"soundcloud:users:332593335","username":"Surviving Society","verified":false,"city":null,"country_code":null,"badges":{"pro":false,"creator_mid_tier":false,"pro_unlimited":true,"verified":false},"station_urn":"soundcloud:system-playlists:artist-stations:332593335","station_permalink":"artist-stations:332593335"}},{"artwork_url":"https://i1.sndcdn.com/artworks-dpuyFCXfF7zI9b5B-fiR2aA-large.jpg","caption":null,"commentable":true,"comment_count":null,"created_at":"2021-08-19T17:25:54Z","description":"Selma James, Sara Callaway, Shanice Octavia McBean \u0026 Aviah Day met the Crossroads Women’s Centre in London to discuss Selma's latest book, Our Time is Now: Sex, Race, Class and Caring for People and Planet https://crossroadsbooksonline.net \n\nGuest Hosts:\nSelma James is an antisexist, antiracist, anti-capitalist campaigner. In 1972 she put forward Wages for Housework (WFH) as a demand and a political perspective that redefined the working class to include all who work without wages, starting with women, the primary carers everywhere. The International WFH Campaign she founded co-ordinates the Global Women's Strike. She co-authored the classic The Power of Women and the Subversion of the Community. With her husband and colleague CLR James, she worked in the movement for independence and federation of the English-speaking Caribbean. Her much-anticipated Our Time Is Now: Sex, Race, Class, and Caring for People and Planet (2021), together with her first anthology, Sex, Race, and Class (2012), focus on what can be learnt from decades of building an international network. Selma James was recently honoured with the Sheila McKechnie Long-term Achievement Award. She is based at the Crossroads Women’s Centre in London.\n\nSara Callaway, Women of Colour Global Women Strike, is an immigrant, active in women’s, anti-racist, environmental justice, anti-war and anti-deportation movements for 40 years.  Women of Colour GWS (WoC) organises to end sexism, racism, poverty, and every discrimination, police violence and militarism. We are part of the global Black Lives Matter movement, focusing especially on Haiti and Palestine. We demand a care income for everyone, of all genders, who do caring work, including justice work, for people and the natural world; the funds to come from military budgets and corporations. WoC is part of Global Women Against Deportations (GWAD), a coalition of groups organising for immigrant rights.\n\nAviah Sarah Day is at Birkbeck, University of London teaching and researching as her job, and is community organiser the rest of the time. She is involved in the East End branch of Sisters Uncut, a national direct-action collective fighting cuts to domestic violence services as well as state violence. She is also involved in London Renters Union and the Kill the Bill Coalition, a national movement resisting the Police, Crime and Sentencing Bill.\n\nShanice Octavia McBean is a Black feminist activist and writer currently working in the Kill the Bill Coalition. She describes herself as an Afro-Marxist and is currently working on a book on criminalisation, abolition and Empire.\n\nChildren in care statistic:  the majority of children taken are white, though disproportionately children of colour. But we have figures to show that in some US areas, including in California, the children are largely Black or Native American, a racist tragedy which we must highlight.  Also the children in Sherley Oaks in Lambeth, were over 50% Black.","downloadable":true,"download_count":null,"duration":3475180,"full_duration":3475174,"embeddable_by":"all","genre":"News \u0026 Politics","has_downloads_left":true,"id":1108926844,"kind":"track","label_name":null,"last_modified":"2021-08-29T10:21:25Z","license":"all-rights-reserved","likes_count":null,"permalink":"s3e2-our-time-is-now-selma-james-sara-callaway-shanice-octavia-mcbean-aviah-day","permalink_url":"https://soundcloud.com/user-622675754/s3e2-our-time-is-now-selma-james-sara-callaway-shanice-octavia-mcbean-aviah-day","playback_count":null,"public":true,"publisher_metadata":{"id":1108926844,"urn":"soundcloud:tracks:1108926844","artist":"Spotlight ","contains_music":true},"purchase_title":null,"purchase_url":null,"release_date":null,"reposts_count":0,"secret_token":null,"sharing":"public","state":"finished","streamable":true,"tag_list":"","title":"S3/E2 Our Time Is Now (Selma James, Sara Callaway, Shanice Octavia McBean \u0026 Aviah Day)","uri":"https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A1108926844","urn":"soundcloud:tracks:1108926844","user_id":332593335,"visuals":null,"waveform_url":"https://wave.sndcdn.com/Y551SkN2aEVq_m.json","display_date":"2021-08-24T01:00:05Z","media":{"transcodings":[{"url":"https://api-v2.soundcloud.com/media/soundcloud:tracks:1108926844/a7c859e3-59cd-4f62-bc8e-3454c39e6249/stream/hls","preset":"aac_96k","duration":3475180,"snipped":false,"format":{"protocol":"hls","mime_type":"audio/mp4; codecs=\"mp4a.40.2\""},"quality":"lq","is_legacy_transcoding":false},{"url":"https://api-v2.soundcloud.com/media/soundcloud:tracks:1108926844/cb405f0f-3c78-41ca-9068-d1b2293b25f7/stream/hls","preset":"abr_sq","duration":3475180,"snipped":false,"format":{ terests lie at the intersection of border politics, 'race', citizenship, and Britain as a post-imperial nation. She has published on the Prevent strategy, Islamophobia, British Muslims and austerity.\n\nDr Naaz Rashid is a Lecturer in Media and Cultural Studies at the University of Sussex. She is author of Veiled Threats: Representing the Muslim Woman in Public Policy Discourses (Policy Press 2016) and her research interests lie in examining the intersections between race, gender and religion.\n\nDr Waqas Tufail is a Senior Lecturer in Criminology at Leeds Beckett University, UK. His research interests primarily concern the policing, racialization and criminalization of marginalized and minority communities and the lived experiences of Muslim minorities. Waqas is a Board Member of the International Sociological Association (ISA) Research Committee on Racism, Nationalism, Indigeneity and Ethnicity, serves on the Editorial Board of Sociology of Race and Ethnicity and is co-editor of Media, Crime, Racism (Palgrave MacMillan, 2018).\n\n\nWaqas Tufail","downloadable":true,"download_count":null,"duration":3520342,"full_duration":3520340,"embeddable_by":"all","genre":"News \u0026 Politics","has_downloads_left":true,"id":1119674623,"kind":"track","label_name":null,"last_modified":"2021-09-14T02:00:07Z","license":"all-rights-reserved","likes_count":null,"permalink":"s3e3-islamophobia-the-war-on-terror-nadya-ali-naaz-rashid-waqas-tufail","permalink_url":"https://soundcloud.com/user-622675754/s3e3-islamophobia-the-war-on-terror-nadya-ali-naaz-rashid-waqas-tufail","playback_count":null,"public":true,"publisher_metadata":{"id":1119674623,"urn":"soundcloud:tracks:1119674623","artist":"The Spotlight","contains_music":true},"purchase_title":null,"purchase_url":null,"release_date":"2021-09-14T00:00:00Z","reposts_count":0,"secret_token":null,"sharing":"public","state":"finished","streamable":true,"tag_list":"","title":"S3/E3 Islamophobia \u0026 the war on terror (Nadya Ali, Naaz Rash "permalink":"user-622675754","permalink_url":"https://soundcloud.com/user-622675754","uri":"https://api.soundcloud.com/users/soundcloud%3Ausers%3A332593335","urn":"soundcloud:users:332593335","username":"Surviving Society","verified":false,"city":null,"country_code":null,"badges":{"pro":false,"creator_mid_tier":false,"pro_unlimited":true,"verified":false},"station_urn":"soundcloud:system-playlists:artist-stations:332593335","station_permalink":"artist-stations:332593335"}},{"artwork_url":"https://i1.sndcdn.com/artworks-qApPSzt69Ue4qqri-Jp9JpA-large.jpg","caption":null,"commentable":true,"comment_count":null,"created_at":"2021-11-30T09:59:03Z","description":"...: with Bernard Coard \u0026 Derron Wallace.\n\n\nGuest Hosts:\nDerron Wallace is an Assistant Professor of Education and Sociology at Brandeis University. Derron is a sociologist of race, ethnicity and education. He specializes in cross-national studies of structural and cultural inequalities in urban schools across global cities, focusing specifically on the experiences of young people of African descent. His current research examines the educational outcomes of Black youth in London and New York City.\n\nBernard Coard taught at his secondary school in Grenada before studying at Brandeis University (USA) and then Sussex University (UK). During the late 1960s and early ‘70s, Bernard ran youth clubs in South East London for children attending seven so-called ESN schools and taught at two others in East London. He subsequently taught at The University of The West Indies and at the Institute of Higher Studies, Netherlands Antilles. In 1971 he published a 50-page book How the West Indian Child Is Made Educationally Sub-normal in the British School System: The Scandal of the Black Child in Schools in Britain. The book explained that British schools had a pervasive bias toward treating white children as normal, which led to black children being labelled as \"educationally subnormal\". For 20 years, Coard set up and
