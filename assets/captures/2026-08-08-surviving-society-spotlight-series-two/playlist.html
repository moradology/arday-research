://api.soundcloud.com/users/soundcloud%3Ausers%3A332593335","urn":"soundcloud:users:332593335","username":"Surviving Society","verified":false,"visuals":{"urn":"soundcloud:users:332593335","enabled":true,"visuals":[{"urn":"soundcloud:visuals:191918739","entry_time":0,"visual_url":"https://i1.sndcdn.com/visuals-000332593335-95ZeEO-original.jpg"}],"tracking":null},"badges":{"pro":false,"creator_mid_tier":false,"pro_unlimited":true,"verified":false},"station_urn":"soundcloud:system-playlists:artist-stations:332593335","station_permalink":"artist-stations:332593335","date_of_birth":null},"tracks":[{"artwork_url":"https://i1.sndcdn.com/artworks-yQb4kKTyUqJH11Em-yA58mQ-large.jpg","caption":null,"commentable":true,"comment_count":null,"created_at":"2020-08-06T12:28:32Z","description":"The Surviving Society team are extremely excited to present #TheSpotlightSeries. In these episodes Chantelle and Tissot take a step back from the mic and handover to both local and global academics, researchers, and community organizers. The Spotlight series continues with the themes from the original Surviving Society podcast focused on race, class, anti- racism and social movements. \n\nGuest hosts: \n\nMwenza Blell: Mwenza is a biosocial anthropologist. She is currently a Rutherford Fellow affiliated to Health Data Research UK, a Newcastle University Academic Track Fellow, and a Grant Researcher at Tampere University. Her research draws from ethnography to examine intransigent and often invisible structures of injustice. She is interested in how subjective experience, socio-political structures and technologies, cultural meaning-making, and human biology interrelate to produce states of well-being and ill-being, with a view to understanding mechanisms underpinning both suffering and flourishing.\n\nFuraha Asani: Furaha is a mental health advocate, teacher, writer, precarious migrant, and a researcher with a PhD in Infection and Immunity. Her research passions lie in bioethics, liberatory STEM pedagogy, and anything that amplifies the message that no human being is ‘illegal’. Her writing focuses on social justice and equity in healthcare, higher education, and science in pop culture. Furaha loves red lipstick, going to afternoon movies by herself, going for walks, and collecting pineapple ornaments.","downloadable":true,"download_count":null,"duration":2965538,"full_duration":2965525,"embeddable_by":"all","genre":"Learning","has_downloads_left":true,"id":871131400,"kind":"track","label_name":null,"last_modified":"2020-08-18T03:00:05Z","license":"all-rights-reserved","likes_count":null,"permalink":"s2e1-objectivity-scientific-racism-racial-justice-furaha-asani-mwenza-blell","permalink_url":"https://soundcloud.com/user-622675754/s2e1-objectivity-scientific-racism-racial-justice-furaha-asani-mwenza-blell","playback_count":null,"public":true,"publisher_metadata":{"id":871131400,"urn":"soundcloud:tracks:871131400","artist":"Spotlight ","contains_music":true},"purchase_title":null,"purchase_url":null,"release_date":"2020-08-18T00:00:00Z","reposts_count":0,"secret_token":null,"sharing":"public","state":"finished","streamable":true,"tag_list":"race science eugenics biology biochemistry academia university pedagogy","title":"S2/E1 'Objectivity', scientific racism \u0026 racial justice (Furaha Asani \u0026 Mwenza Blell)","uri":"https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A871131400","urn":"soundcloud:tracks:871131400","user_id":332593335,"visuals":null,"waveform_url":"https://wave.sndcdn.com/CXrHUAnr2BAb_m.json","display_date":"2020-08-18T03:00:05Z","media":{"transcodings":[{"url":"https://api-v2.soundcloud.com/media/soundcloud:tracks:871131400/691d2ba1-a493-4b2a-a64d-4b30fdb2ef1b/stream/hls","preset":"aac_96k","duration":2965538,"snipped":false,"format":{"protocol":"hls","mime_type":"audio/mp4; codecs=\"mp4a.40.2\""},"quality":"lq","is_legacy_transcoding":false},{"url":"https://api-v2.soundcloud.com/media/soundcloud:tracks:871131400/68919f3f-910d-43 ty team are extremely excited to present #TheSpotlightSeries. In these episodes Chantelle and Tissot take a step back from the mic and handover to both local and global academics, researchers, and community organizers. The Spotlight series continues with the themes from the original Surviving Society podcast focused on race, class, anti- racism and social movements.\n\n\nGuest Hosts: \nThe Coalition of Anti-Racist Educators (CARE) and Black Educators Alliance (BEA) includes teachers who work in primary and secondary schools.\n\n\nCamille London-Miyo has been an English teacher, Head of English, and Deputy Headteacher in inner-city schools for the past thirty years. She is a Community Activist who actively builds parent/community networks to support and challenge the negative narratives about Black communities in Education Her understanding of the complexity and importance of involving students, parents and communities in order to achieve genuine and sustained progress in  UK education at all levels has been the foundation to her work, to date, within teacher networks and professional development programmes across the UK. She was elected the first Black President in the history of Leicester's teaching unions ( that spans over a hundred years) in 2018.\nCamille is also one of the co-founders of the  Black Educators Alliance and the Leicester Black Educators Network. Her interests include Black teachers in education - recruitment, retention and progression, radical pedagogies that challenge empirical ideas about teaching and learning; Developing a Global \"English\" Literature Curriculum as part of a holistic anti-racist strategy in Schools. She has written a chapter entitled \"Education, race and the decolonisation of the Curriculum\" in Beyond the Blockade - Education in Cuba(2019)  and a recent article for the Independent on the impact of the PSHE Guidance. She is one of the co-editors of the upcoming 'History of Black Teachers in the NEU' to be published in 2021.\n\nAliyah York is a 17 year old A-level student, Activist and founder of @ThePupilPower. Her award winning work and contributions to educational change seek to centre youth voice, challenging the status quo and encouraging her peers to reimagine the 21st century education system.\nShe tweets at @aliyahiyork\n\nIlyas Nagdee is a writer and activist with a focus on policing, security and antiracism. He has written for outlets such as The Independent, Guardian, Tribune, Red Pepper and other publications. He tweets at @ilyas_nagdee\n\nUseful links:\nhttps://www.crowdjustice.com/case/liberate-our-classrooms/\nhttps://nomoreexclusions.com/care/\nhttps://blackeducatorsalliance.org/\nhttps://www.gov.uk/guidance/plan-your-relationships-sex-and-health-curriculum","downloadable":true,"download_count":null,"duration":2128222,"full_duration":2128222,"embeddable_by":"all","genre":"Learning","has_downloads_left":true,"id":929723182,"kind":"track","label_name":null,"last_modified":"2020-11-24T02:00:02Z","license":"all-rights-reserved","likes_count":null,"permalink":"s2e2-carebea-legal-challenge-against-the-new-pshe-curriculum-guidance","permalink_url":"https://soundcloud.com/user-622675754/s2e2-carebea-legal-challenge-against-the-new-pshe-curriculum-guidance","playback_count":null,"public":true,"publisher_metadata":{"id":929723182,"urn":"soundcloud:tracks:929723182","artist":"Spotlight Ep 10","contains_music":true},"purchase_title":null,"purchase_url":null,"release_date":"2020-11-24T00:00:00Z","reposts_count":0,"secret_token":null,"sharing":"public","state":"finished","streamable":true,"tag_list":"education School antiracism racism government Politics race class","title":"S2/E2 CARE \u0026 BEA legal challenge against the new government PSHE curriculum guidance","uri":"https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A929723182","urn":"soundcloud:tracks:929723182","user_id":332593335,"visuals":null,"waveform_url":"https://wave.sndcdn.com/wKdDz9dkIYvj_m.json","display_date":"202 to both local and global academics, researchers, and community organizers. The Spotlight series continues with the themes from the original Surviving Society podcast focused on race, class, anti- racism and social movements.\n\n\nGuest hosts: \nVron Ware has worked as a journalist, photographer and academic in the field of cultural geography and sociology. Her books include Beyond the Pale: white women, racism and history (Verso 1992/2015), Out of Whiteness: color, politics \u0026 culture (with Les Back, Chicago 2002), Military Migrants: fighting for YOUR country (Palgrave 2012). Currently professor of sociology \u0026 gender studies at Kingston University, she is now working on a book about the English countryside.\n\nLuke de Noronha's research focuses on the politics of immigration, racism and deportation, and his book Deporting Black Britons: Portraits of Deportation to Jamaica is out in June 2020 with Manchester University Press.This ethnographic monograph tells the life stories of four men who grew up in the UK, and were banished to Jamaica following criminal conviction. Luke has written for the Guardian, Verso blogs, VICE, Red Pepper, Open Democracy, The New Humanist, and Ceasefire Magazine. He has also produced a podcast with deported people in Jamaica, Deportation Discs (a play on desert island discs).","downloadable":true,"download_count":null,"duration":3148458,"full_duration":3148460,"embeddable_by":"all","genre":"Learning","has_downloads_left":true,"id":929812591,"kind":"track","label_name":null,"last_modified":"2020-12-15T03:00:01Z","license":"all-rights-reserved","likes_count":null,"permalink":"s2e1-critical-whiteness-studies-vron-ware-luke-de-noronha","permalink_url":"https://soundcloud.com/user-622675754/s2e1-critical-whiteness-studies-vron-ware-luke-de-noronha","playback_count":null,"public":true,"publisher_metadata":{"id":929812591,"urn":"soundcloud:tracks:929812591","artist":"The Spotlight","contains_music":true},"purchase_title":null,"purchase_ur hSREQ","monetization_model":"NOT_APPLICABLE","policy":"ALLOW","user":{"avatar_url":"https://i1.sndcdn.com/avatars-YwydBGYIMyTLcfND-FB8F7Q-large.jpg","first_name":"","followers_count":551,"full_name":"","id":332593335,"kind":"user","last_modified":"2024-02-06T08:44:47Z","last_name":"","permalink":"user-622675754","permalink_url":"https://soundcloud.com/user-622675754","uri":"https://api.soundcloud.com/users/soundcloud%3Ausers%3A332593335","urn":"soundcloud:users:332593335","username":"Surviving Society","verified":false,"city":null,"country_code":null,"badges":{"pro":false,"creator_mid_tier":false,"pro_unlimited":true,"verified":false},"station_urn":"soundcloud:system-playlists:artist-stations:332593335","station_permalink":"artist-stations:332593335"}},{"artwork_url":"https://i1.sndcdn.com/artworks-2ZFmFBUXG3k6PVFH-33I9SA-large.jpg","caption":null,"commentable":true,"comment_count":null,"created_at":"2020-11-29T15:25:56Z","description":"The Surviving Society team are extremely excited to present #TheSpotlightSeries. In these episodes Chantelle and Tissot take a step back from the mic and handover to both local and global academics, researchers, and community organizers. The Spotlight series continues with the themes from the original Surviving Society podcast focused on race, class, anti- racism and social movements.\n\nGuest hosts:\nCarmen Geha is an Associate Professor of Public Administration, Leadership, and Organizational Development at the American University of Beirut (AUB). She is also a co-founder and Research Associate at the Center for Inclusive Business \u0026 Leadership (CIBL) for women, a regional reference for readying gender-inclusive employers across the Arab MENA region. At CIBL for Women, Dr. Geha oversees research team of 40 across 11 countries in the MENA on developing inclusive policies at the organizational and national levels. Carmen is also co-founder and Deputy Director of Khaddit Beirut (the shake-up) a transdisciplinary team born in the wake of the Beirut port explosion to create a systematic and community-led roadmap for recovery in the areas of: community health, community education, environmental health, and inclusive businesses. Between 2018 and 2020, she served as Founding Director of “Education for Leadership in Crisis” Scholarship Program for Afghan women at AUB securing and managing $4.6 in tuition funding for students. Carmen’s research examines the nexus between politics and public institutions with a focus on three areas of specialization: 1- women’s political and economic participation, 2- refugee crisis politics and policies, and 3- civil society and protest movements. Carmen has held Vising Research positions at the Weatherhead Center for International Affairs at Harvard University and the Watson Institute for International and Public Affairs at Brown University. She is the 2018-2019 Fellow in the Program in Social Science at the Institute for Advanced Study.\nCarmen is a revolutionary activist and an advocate of gender equity and refugee protection. In addition to her academic track, she has several years of practitioner experience having worked as a consultant and adviser to international organizations, UN agencies, and government institutions in Myanmar, Tunisia, Libya, Turkey, Saudi Arabia, Iraq, and Lebanon.\n\nSrila Roy:\nSrila Roy is Associate Professor of Sociology, and heads Development Studies at the University of the Witwatersrand, South Africa. She is the author of Remembering Revolution: Gender, Violence and Subjectivity in India’s Naxalbari Movement (Oxford, 2012), editor of New South Asian Feminisms (Zed, 2012) and co-editor of New Subaltern Politics (Oxford 2015). She is currently writing a monograph on feminist and queer politics in globalised India and co-editing a volume of essays on MeToo in India and South Africa. At Wits, she leads the Andrew W. Mellon funded Governing Intimacies project, which promotes new scholarship on gender and sexuality in Southern Africa an
