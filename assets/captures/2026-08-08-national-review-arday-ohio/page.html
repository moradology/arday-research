ge_padding_desktop":"15px","image_padding_mobile":"10px"},"next_up":{"id":2011031,"link":"https:\/\/www.nationalreview.com\/news\/rogers-doesnt-care-who-wins-michigans-dem-primary-not-much-difference-between-stevens-el-sayed\/","title":{"rendered":"Rogers Doesn&#8217;t Care Who Wins Michigan&#8217;s Dem Primary: &#8216;Not Much Difference&#8217; Between Stevens, El-Sayed"},"cta_label":"Next News Article"},"nrplus_cta":[],"timestamp":"<time class=\"article-header__meta-pubdate separator\" datetime=\"2026-08-04T15:06:08-04:00\" title=\"August 4, 2026 3:06 PM\">August 4, 2026 3:06 PM<\/time>","queried_object":{"id":2011531,"date":"2026-08-04T15:06:08","date_gmt":"2026-08-04T19:06:08","guid":{"rendered":"https:\/\/www.nationalreview.com\/?post_type=blog-post&#038;p=2011531"},"modified":"2026-08-04T15:31:45","modified_gmt":"2026-08-04T19:31:45","slug":"cambridge-prof-fighting-plagiarism-allegations-seems-to-have-fabricated-major-u-s-university-affiliation","status":"publish","type":"blog-post","link":"https:\/\/www.nationalreview.com\/news\/cambridge-prof-fighting-plagiarism-allegations-seems-to-have-fabricated-major-u-s-university-affiliation\/","title":{"rendered":"Cambridge Prof Fighting Plagiarism Allegations Seems to Have Fabricated Major U.S. University Affiliation"},"content":{"rendered":"<p>Jason Arday, who received media attention for becoming the youngest black professor ever at the University of Cambridge in England, has recently come under scrutiny for allegedly fabricating his professional affiliations and plagiarizing his academic work.<\/p>\n<Connatix preset=\"loggedOut\"><\/Connatix>\n<AdUnit name=\"incontent-1-mobile\" baseUnitName=\"incontent-1\" unitType=\"mobile\"><\/AdUnit>\n<AdUnit name=\"incontent-1-desktop\" baseUnitName=\"incontent-large\" unitType=\"desktop\"><\/AdUnit><TopStories desktop=\"true\" variant=\"default\"><\/TopStories>\n<p>Now, another line on his r\u00e9sum\u00e9 is in doubt: Arday says on his <a href=\"https:\/\/www.jesus.cam.ac.uk\/people\/jason-arday?ref=ed_direct\" target=\"_blank\" rel=\"noopener\">official faculty website<\/a> that he is a visiting professor at The Ohio State University in the Office of Diversity and Inclusion \u2014 but Ohio State\u2019s DEI office shuttered in 2025, and the school said he was never an employee.<\/p>\n<p>\u201cWe have no record of an employee by that name,\u201d Ohio State University spokesman Benjamin Johnson told <span class=\"small_caps\">National Review<\/span> on Tuesday.<\/p>\n<p>Ohio State <a href=\"https:\/\/news.osu.edu\/ohio-state-shares-initial-reorganization-continuing-review-of-diversity-equity-and-inclusion-programs\/\" target=\"_blank\" rel=\"noopener\">previously announced<\/a> that its Office of Diversity and Inclusion would close, effective February 28, 2025. Arday did not respond to a request for comment.<\/p>\n<p>The Ohio State revelation comes after <a href=\"https:\/\/www.heraldscotland.com\/news\/26433564.glasgow-university-denies-jason-arday-visiting-prof-claim\/\" target=\"_blank\" rel=\"noopener\"><em>The Herald<\/em>, a Scottish newspaper, revealed earlier this week<\/a> that Arday\u2019s claim to have worked as a visiting professor at the University of Glasgow in its School of Education was false.<\/p>\n<p>Recent investigations have revealed that Arday, who became Cambridge\u2019s youngest black professor ever at the age of 37 in 2023, plagiarized some of his academic work and fabricated many of his achievements.<\/p>\n<p>Controversy surrounding Arday began when Nathan Cofnas, a postdoctoral researcher at Ghent University in Belgium, published the article \u201c<a href=\"https:\/\/ncofnas.com\/p\/dei-fraud-and-cover-up-at-cambridge\" target=\"_blank\" rel=\"noopener\">DEI Fraud and Cover-Up at Cambridge<\/a>\u201d on his personal blog on July 21. The article details instances of plagiarism throughout Arday\u2019s academic work, including in his doctoral dissertation.<\/p>\n<AdUnit name=\"incontent-2-desktop\" baseUnitName=\"incontent-small\" unitType=\"desktop\"><\/AdUnit><MoreInTag desktop=\"true\" variant=\"default\"><\/MoreInTag>\n<p>\u201cIf one removes the apparently plagiarized material from his record, there is little or no real scholarship,\u201d Cofnas <a href=\"https:\/\/ncofnas.com\/p\/dei-fraud-and-cover-up-at-cambridge\" target=\"_blank\" rel=\"noopener\">wrote<\/a> of Arday. Cofnas previously held a research position with Emmanuel College at the University of Cambridge, which the college terminated because of his previous writings, some of which focused on IQ differences across racial groups and disparate outcomes in meritocracies. One of Cofnas\u2019s particularly controversial claims was that the number of black students at Harvard would fall below 1 percent if admissions were strictly meritocratic, although that figure was drawn from an internal report produced by Harvard University\u2019s own Office of Institutional Research, a document that Harvard\u2019s <a href=\"https:\/\/api.thecrimson.com\/article\/2018\/6\/15\/admissions-internal-report\/\" target=\"_blank\" rel=\"noopener\">lawyers<\/a> later described as \u201cincomplete, preliminary, and based on limited inputs.\u201d <a href=\"https:\/\/thecritic.co.uk\/cofnas-cambridge-and-academic-freedom\/\" target=\"_blank\" rel=\"noopener\">Cofnas sued Emmanuel College and lost<\/a>, although the university itself had previously confirmed that <a href=\"https:\/\/www.cam.ac.uk\/notices\/news\/statement-on-disciplinary-investigation-dr-cofnas\" target=\"_blank\" rel=\"noopener\">his speech was lawful<\/a> and did not contravene the institution\u2019s free-speech policies.<\/p>\n<AdUnit name=\"incontent-2-mobile\" baseUnitName=\"incontent-2\" unitType=\"mobile\"><\/AdUnit><TopStories mobile=\"true\" variant=\"default\"><\/TopStories>\n<p>Given the previous controversies surrounding Cofnas\u2019s writing on race, Arday and his supporters have attempted to brand the plagiarism accusations as part of a racist smear campaign. Liverpool John Moores University, which awarded Arday his Ph.D. in 2016, says it previously reviewed the allegations and concluded there were instances of \u201c<a href=\"https:\/\/www.thetimes.com\/article\/fdd5c748-002c-4ec4-a299-16f2f273faa2?shareToken=dbdf1eac7322b4f8ded4ac7a346cf66a\" target=\"_blank\" rel=\"noopener\">honest and reasonable error<\/a>.\u201d The review panel cleared Arday.<\/p>\n<Connatix preset=\"legacy\"><\/Connatix>\n<p>\u201cThere has been, since I arrived at Cambridge, a very well orchestrated and co-ordinated campaign to unseat me from my position,\u201d Arday said <a href=\"https:\/\/www.thetimes.com\/article\/fdd5c748-002c-4ec4-a299-16f2f273faa2?shareToken=dbdf1eac7322b4f8ded4ac7a346cf66a\" target=\"_blank\" rel=\"noopener\">in a recent interview<\/a>. \u201cThe motive is racially motivated. I think there\u2019s a reason why it\u2019s me, and I do think that reason is aligned to ableism and racism.\u201d<\/p>\n<p>But the evidence against him is piling up. <em>The Telegraph<\/em> reports that <a href=\"https:\/\/www.telegraph.co.uk\/news\/2026\/07\/28\/calls-for-cambridge-professor-to-face-plagiarism-inquiry\/\" target=\"_blank\" rel=\"noopener\">188 sentences in Arday\u2019s doctoral dissertation<\/a> were identical or highly similar to the work of Paula Zwozdiak-Myers. And the issues are not limited to his dissertation.<\/p>\n<p>Some academic journals seemingly became aware that they had published Arday\u2019s work that contained verbatim copying, paraphrasing with just minor alterations, and other flaws. But they <a href=\"https:\/\/www.mdpi.com\/2076-0760\/12\/12\/672\" target=\"_blank\" rel=\"noopener\">issued updated versions with enhanced citations<\/a> and revised text, rather than retracting the articles.<\/p>\n<AdUnit name=\"incontent-3-desktop\" baseUnitName=\"incontent-large\" unitType=\"desktop\"><\/AdUnit><MoreFromAuthor desktop variant=\"default\"><\/MoreFromAuthor>\n<p>The journal <em>Social Sciences<\/em> updated Arday\u2019s 2018 article \u2014 <em>Understanding Mental Health: What Are the Issues for Black and Ethnic Minority Students at University? \u2014 <\/em>and issued an editor\u2019s note saying that the piece had been revised and citations had been added so that \u201cit is clear where ideas were adapted from past research.\u201d<\/p>\n<p>The academic-integrity watchdog Retraction Watch reports that <a href=\"https:\/\/retractionwatch.com\/2026\/07\/27\/cambridge-jason-arday-plagiarism-allegations-times-higher-education-exclusive\/\" target=\"_blank\" rel=\"noopener\">other substantive changes<\/a> were made to the <em>Social Sciences<\/em> article that were not acknowledged in the editor\u2019s note, such as how the interviews were recorded and transcribed. Furthermore, the updated article entirely cut a quote from a participant.<\/p>\n<AdUnit name=\"incontent-3-mobile\" baseUnitName=\"incontent-3\" unitType=\"mobile\"><\/AdUnit><MoreInTag mobile=\"true\" variant=\"default\"><\/MoreInTag>\n<AdUnit name=\"incontent-4-mobile\" baseUnitName=\"incontent-4\" unitType=\"mobile\"><\/AdUnit>\n<p>Additionally, the <em>Social Sciences<\/em> article has many spelling errors and grammatical mistakes. The first sentence of the introduction misspells \u201cdiagnoses\u201d as \u201cdiagoneses,\u201d for instance.<\/p>\n<AdUnit name=\"incontent-4-desktop\" baseUnitName=\"incontent-small\" unitType=\"desktop\"><\/AdUnit>\n<p>Arday has defended his work in light of the plagiarism accusations, telling the media that <a href=\"https:\/\/www.bbc.com\/news\/articles\/c78gmp7zylvo\" target=\"_blank\" rel=\"noopener\">he relied on mimicry to make sense of information because he is autistic<\/a>. But last year, he tried to silence coverage: <em>Times Higher Education<\/em> had been developing an article in 2025 related to Arday\u2019s plagiarism, but axed it after Arday enlisted the support of a leading defamation firm in the United Kingdom, <a href=\"https:\/\/retractionwatch.com\/2026\/07\/27\/cambridge-jason-arday-plagiarism-allegations-times-higher-education-exclusive\/\" target=\"_blank\" rel=\"noopener\">per<\/a> Retraction Watch. Arday <a href=\"https:\/\/www.thetimes.com\/article\/fdd5c748-002c-4ec4-a299-16f2f273faa2?shareToken=dbdf1eac7322b4f8ded4ac7a346cf66a\" target=\"_blank\" rel=\"noopener\">reported<\/a> a person who identified the plagiarism <a href=\"https:\/\/www.theguardian.com\/education\/ng-interactive\/2026\/aug\/01\/playbooks-plagiarism-pigs-head-new-claims-surrounding-cambridge-professor-jason-arday\" target=\"_blank\" rel=\"noopener\">to the police for harassment<\/a>, which police did not pursue.<\/p>\n<ArticleNewsletter desktop=\"true\"><\/ArticleNewsletter><AdUnit name=\"incontent-5-desktop\" baseUnitName=\"incontent-large\" unitType=\"desktop\"><\/AdUnit>\n<p>Aside from plagiarism, Arday\u2019s academic work falls short of meeting rigorous standards. The <a href=\"https:\/\/researchonline.ljmu.ac.uk\/id\/eprint\/4552\/1\/158222_Jason%2520Arday_%2520Final%2520PhD%2520Thesis%2520Vesrion%2520Final%2520Draft%2520Oct%25202015.pdf\" target=\"_blank\" rel=\"noopener\">title of his doctoral thesis<\/a> has a punctuation error that is repeated throughout the document: \u201cAn exploration of peer-mentoring among student teachers\u2019 [sic] to inform reflective practice within the context of action research.\u201d (This error may result from copying Paula Zwozdiak-Myers, <a href=\"https:\/\/bura.brunel.ac.uk\/bitstream\/2438\/4316\/1\/FulltextThesis.pdf\" target=\"_blank\" rel=\"noopener\">whose title correctly uses the apostrophe<\/a>: \u201cAn analysis. . . into the development of student teachers\u2019 reflective practice within the context of action research.\u201d) There are grammatical errors and spelling mistakes throughout Arday\u2019s thesis.<\/p>\n<ArticleNewsletter mobile=\"true\"><\/ArticleNewsletter><AdUnit name=\"incontent-5-mobile\" baseUnitName=\"incontent-1\" unitType=\"mobile\"><\/AdUnit><MoreFromAuthor mobile variant=\"default\"><\/MoreFromAuthor>\n<p>Other articles by Arday seemingly lack methodological rigor.<\/p>\n<p>For the article \u201c<a href=\"https:\/\/journals.sagepub.com\/doi\/10.1177\/0892020618791002\" target=\"_blank\" rel=\"noopener\">Understanding Race and Educational Leadership in Higher Education: Exploring the Black and Ethnic Minority (BME) Experience,<\/a>\u201d which was published by the journal <em>Management in Education<\/em> in 2018, Arday interviewed just three minority academics who held senior leadership positions at higher-education institutions in the United Kingdom, who were selected because of \u201ctheir convenient accessibility and proximity to the researcher.\u201d The article concludes by endorsing affirmative action in hiring, racial quotas for hiring shortlists, and mentorship programs in higher education. As is the case with his other work, Arday\u2019s <em>Management in Education<\/em> article is littered with grammatical errors and misspellings.<\/p>\n<AdUnit name=\"incontent-6-desktop\" baseUnitName=\"incontent-small\" unitType=\"desktop\"><\/AdUnit>\n<p>Aside from concerns about the legitimacy of his scholarship and falsified qualifications, recent reporting suggests that Arday has consistently exaggerated his personal feats.<\/p>\n<AdUnit name=\"incontent-6-mobile\" baseUnitName=\"incontent-2\" unitType=\"mobile\"><\/AdUnit>\n<p>Arday was previously celebrated in the British media, <a href=\"https:\/\/nypost.com\/2023\/02\/25\/i-couldnt-read-until-18-now-im-the-youngest-black-professor-at-cambridge\/\" target=\"_blank\" rel=\"noopener\">as well as American outlets like the <em>New York Post<\/em><\/a> and <a href=\"https:\/\/www.cbsnews.com\/news\/jason-arday-cambridge-university-youngest-black-professor-didnt-speak-age-11-autism\/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a>, as an inspiration for overcoming great adversity: He says he was diagnosed with autism at age three, was nonverbal until age eleven, and illiterate \u2014 <a href=\"https:\/\/www.instagram.com\/reel\/DI4TuXZODng\/?utm_source=ig_web_copy_link&amp;igsh=NTc4MTIwNjQ2YQ==\" target=\"_blank\" rel=\"noopener\">struggling to even spell his own name<\/a> \u2014 until age 18. Other <a href=\"https:\/\/wellsprings.in\/human-potential-overcoming-barriers-academic-summits\/\" target=\"_blank\" rel=\"noopener\">articles<\/a> further claim that <a href=\"https:\/\/www.news24.com\/you\/news\/international\/he-couldnt-speak-until-he-was-11-now-jason-arday-is-the-youngest-black-professor-at-the-university-of-cambridge-20230313\" target=\"_blank\" rel=\"noopener\">Arday was deaf in one ear<\/a> and <a href=\"https:\/\/www.theguardian.com\/society\/2023\/jul\/11\/jason-arday-cambridge-university-youngest-black-professor\" target=\"_blank\" rel=\"noopener\">used sign language to communicate<\/a> until age eleven. The British media also lauded Arday\u2019s purported charity work, for which he was honored as a torchbearer in the 2012 Olympics.<\/p>\n<p>Yet many of his achievements seem highly implausible.<\/p>\n<AdUnit name=\"incontent-7-desktop\" baseUnitName=\"incontent-large\" unitType=\"desktop\"><\/AdUnit>\n<p>Existing research suggests it is unusual to develop normal speech abilities at age eleven after a lifetime of being nonverbal. It is similarly strange that Arday claims to have passed two secondary school exams, which are normally taken between ages 14 and 16 in the United Kingdom, but only learned to read at age 18. However, there are testing accommodations available that could explain his exams.<\/p>\n<p>But the stories only get more elaborate from there.<\/p>\n<AdUnit name=\"incontent-7-mobile\" baseUnitName=\"incontent-3\" unitType=\"mobile\"><\/AdUnit>\n<p>Arday says he has helped <a href=\"https:\/\/www.aru.ac.uk\/graduation-and-alumni\/honorary-award-holders2\/jason-arday\" target=\"_blank\" rel=\"noopener\">raise millions of dollars for charity<\/a>, accomplished in part by running 300 miles in three days, 600 miles across six days, and 30 marathons in 35 days \u2014 the last nine of which he claims to have completed with a broken leg. After <em>The Telegraph<\/em> reported that running 600 miles over six days was nearly a world record, <a href=\"https:\/\/www.theguardian.com\/education\/ng-interactive\/2026\/aug\/01\/playbooks-plagiarism-pigs-head-new-claims-surrounding-cambridge-professor-jason-arday?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Arday said the feat was actually completed over twelve days<\/a>.<\/p>\n<AdUnit name=\"incontent-8-desktop\" baseUnitName=\"incontent-small\" unitType=\"desktop\"><\/AdUnit>\n<p><a href=\"https:\/\/www.justgiving.com\/fundraising\/the300\" target=\"_blank\" rel=\"noopener\">A fundraising page from 2011<\/a> says that Arday raised just a few hundred dollars from 21 people to run 300 miles in three days. Speaking to <em>The Guardian<\/em>, Arday said the \u00a35 million figure reflected \u201c<a href=\"https:\/\/www.theguardian.com\/education\/ng-interactive\/2026\/aug\/01\/playbooks-plagiarism-pigs-head-new-claims-surrounding-cambridge-professor-jason-arday?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">many fundraising collectives over a two-decade period<\/a>,\u201d but claimed he could not identify other participants in these endeavors because of nondisclosure agreements. In 2012, Arday said he aspired to raise just \u00a3250,000 for charity by age 50.<\/p>\n<p>Aside from running fundraisers, Arday claims to have assisted with \u201cinstalling water points\u201d in South America and West Africa through the international nonprofit WaterAid \u2014 <a href=\"https:\/\/www.telegraph.co.uk\/news\/2026\/08\/03\/cambridge-professor-accused-plagiarism-loses-key-ally-uk\/\" target=\"_blank\" rel=\"noopener\">but the organization has a policy that it does not send its volunteers abroad<\/a>.<\/p>\n<p>As a result of his public profile and prestigious academic roles, Arday has said that he was targeted by racists who sent him malicious communications. Arday specifically claimed that bananas and bullets were mailed to his university office, and that corrosive substances \u2014 as well as a mutilated pig head \u2014 were sent to his home. <em>The Guardian<\/em> found no proof that these particular events occurred; the only corroboration came from Arday and his family. Arday also <a href=\"https:\/\/www.theguardian.com\/education\/ng-interactive\/2026\/aug\/01\/playbooks-plagiarism-pigs-head-new-claims-surrounding-cambridge-professor-jason-arday\" target=\"_blank\" rel=\"noopener\">told<\/a> <em>The Guardian<\/em> that a masked man arrived at his university building and threatened to cause harm if he did not resign; the intruder was not seen on security recordings, and faculty did not report seeing any suspicious activity.<\/p>\n<AdUnit name=\"incontent-9-desktop\" baseUnitName=\"incontent-large\" unitType=\"desktop\"><\/AdUnit>\n<AdUnit name=\"incontent-8-mobile\" baseUnitName=\"incontent-4\" unitType=\"mobile\"><\/AdUnit>\n<p>In 2021, Arday said he had completed his doctoral work with a brain tumor, which he says was removed just <a href=\"https:\/\/www.youtube.com\/watch?v=OxhxHU44lGY\" target=\"_blank\" rel=\"noopener\">two weeks before his oral defense. Arday says he then suffered a stroke<\/a> which required him to relearn the material because of memory loss. Although recovery time for brain-tumor removal varies, medical guidance generally suggests a recovery period <a href=\"https:\/\/www.ucihealth.org\/medical-services\/treatments\/brain-tumor-surgery\" target=\"_blank\" rel=\"noopener\">from six weeks to three months<\/a>. Patients usually remain <a href=\"https:\/\/www.hopkinsmedicine.org\/health\/conditions-and-diseases\/brain-tumor\/brain-tumor-surgery\" target=\"_blank\" rel=\"noopener\">in the hospital for two to five days<\/a> after a brain-tumor removal.<\/p>\n<p>The Good Law Project, a nonprofit organization based in the United Kingdom, issued a statement in support of Arday that was signed by University of Cambridge affiliates, members of Parliament, heads of nonprofits, lawyers, leaders of the Green Party, and others. Professor Dame Ijeoma Uchegbu, the head of Wolfson College at Cambridge University, had previously signed the letter but has seemingly retracted her name.<\/p>\n<p>\u201cRightwing media have attempted to smear Professor Arday\u2019s reputation and undermine his career. That should concern everyone who believes in academic freedom, fairness and due process,\u201d says the <a href=\"https:\/\/goodlawproject.org\/petition\/stand-in-solidarity-with-jason-arday\/\" target=\"_blank\" rel=\"noopener\">letter<\/a>. \u201cIt is difficult to ignore the question of motivation. When a distinguished Black academic is repeatedly subjected to baseless allegations after being fully exonerated, it signals there is an attempt to undermine Black people who hold positions of influence.\u201d<\/p>\n<p>The letter now has nearly 15,000 signatures \u2014 although some of the names include \u201cBaron Munchausen,\u201d \u201cAdolf,\u201d and \u201cI_love_fraud.\u201d<\/p>\n<p>Arday\u2019s memoir, <em>Great and Unfortunate Things<\/em>, is scheduled to be published this year by 37 Ink, an imprint of Simon and Schuster.<\/p>\n<p class=\"news-tip-cta\"><a href=\"https:\/\/www.nationalreview.com\/tips\/\"><em>Send a tip to the news team at <\/em>NR.<\/a><\/p>\n","protected":false},"excerpt":{"rendered":"<p>Ohio State has no record of a Jason Arday \u2014 and its DEI office, where he says he works, closed last year.<\/p>\n","protected":false},"featured_media":2011545,"comment_status":"open","ping_status":"closed","template":"","meta":{"hide-more-from-author":false,"disable-player":false,"disable-wfb-100-badge":false,"disable-wfb-100-archive-widget":false,"disable-wfb-100-legacy-widget":false,"hide_top_stories":false,"headline_variations":[],"coral_asset_id":"","_cr_original_post":"","_cr_replace_post_id":"","_cr_replacing_post_id":"","_links_to
