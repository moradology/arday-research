        <style>
            *, *:before, *:after {
                box-sizing: inherit;
            }
            html {
                box-sizing: border-box;
            }
            body {
                background: #f4f1f0;
                margin: 0;
            }
            img {
                max-width: 100%;
                margin: 0 auto;
            }

            .content {
                margin: 0 auto;
                text-align: center;
                padding-top: 48px;
                max-width: 876px;
            }

            .logo {
                width: 214px;
            }

            h2,
            p {
                text-align: center;
            }
            h2 {
                color: #29473d;
                font-family: Playfair Display, serif;
                font-size: 32px;
                margin-bottom: 0;
                font-weight: normal;
            }
            p {
                font-family: 'Lato', sans-serif;
                font-size: 20px;
                line-height: 26px;
            }
            p span {
                text-decoration: underline;
                cursor: pointer;
            }

            .error-mob {
                display: none;
            }

        /* Mobile layout */
            @media only screen and (max-width: 600px) {
                .content {
                    padding-top: 28px;
                }
                .logo {
                    width: 160px;
                }
                h2,
                p {
                    margin-left: 10px;
                    margin-right: 10px;
                }
                h2 {
                    margin-top: 10px;
                }
                p {
                    font-size: 18px;
                }
                .error-dsktp {
                    display: none;
                }
                .error-mob {
                    display: block;
                }
            }

        </style>
