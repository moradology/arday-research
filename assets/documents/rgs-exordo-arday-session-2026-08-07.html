l (organised session) convenors' and 'Panel (organised session) paper contributors' - leave the answers blank.</li><li>You will be asked to select whether you would like to be considered for an in-person or online session. Please note that we reserve the right to move individual papers to an online format to ensure session viability.</li></ol>\n<p><strong>Individual submissions to a Panel (organised session)</strong></p>\n<ol><li>If you have already been accepted for that panel by the session organisers, they will have provided you with a direct link to the panel details. Use the 'Submit to Panel' button to submit your abstract.</li><li>Please review the guidance for presenters before submitting your abstract. This is available <a href=\"https://www.rgs.org/research/annual-international-conference/call-for-sessions-papers-and-posters/guidance-for-presenters\" target=\"_blank\" rel=\"nofollow\" data-bypass=\"true\">here</a>.</li><li>Abstracts should be limited to 400 words.</li><li>Please skip the pages of additional questions for 'Panel (organised session) convenors' and 'Open call for papers authors' - leave the answers blank.</li><li>Please include up to 5 keywords for your paper, where indicated.</li></ol>\n<p>If you have any questions, please check our Frequently Asked Questions <a href=\"https://www.rgs.org/research/annual-international-conference/frequently-asked-questions\" target=\"_blank\" rel=\"nofollow\" data-bypass=\"true\">here</a>, or <a href=\"mailto:ac2026@rgs.org\" target=\"_blank\" rel=\"nofollow\" data-bypass=\"true\">contact us</a>.</p>","restrict_abstract_length":false,"abstract_word_count":500,"panel_description_word_limit":500,"abstract_attachments":false,"abstract_attachment_limit":3,"valid_abstract_attachment_file_types":"[\"jpg\",\"gif\",\"png\",\"jpeg\"]","show_submission_language":false,"biographies_enabled":false,"restrict_biography_length":200,"student_submissions_enabled":false,"topics_enabled":true,"max_authors":0,"max_presenting_auth
